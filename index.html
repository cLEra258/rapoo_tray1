<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Rapoo 控制台</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; background: #f9fafb; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4f46e5; color: white; border: none; border-radius: 6px; }
        #status { margin-top: 15px; font-weight: bold; color: #374151; }
    </style>
</head>
<body>
    <h2>Rapoo 电量托盘程序</h2>
    <p>请点击下方按钮连接设备。连接后可以关闭此窗口，程序将在系统托盘后台运行。</p>
    <button id="connectBtn">连接 Rapoo 设备</button>
    <div id="status">未连接</div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const statusEl = document.getElementById('status');
        
        function createIconBase64(pct) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 64, 64);

            ctx.fillStyle = '#464646';
            ctx.beginPath(); ctx.roundRect(6, 18, 46, 30, 8); ctx.fill();
            ctx.beginPath(); ctx.roundRect(52, 26, 6, 14, 2); ctx.fill();

            ctx.fillStyle = '#fafafa';
            ctx.beginPath(); ctx.roundRect(10, 22, 38, 22, 4); ctx.fill();

            if (pct > 0) {
                let color = pct < 20 ? '#ef4444' : pct < 50 ? '#f59e0b' : '#10b981';
                ctx.fillStyle = color;
                let fillWidth = (38 * pct) / 100;
                if (fillWidth < 4) fillWidth = 4;
                ctx.beginPath(); ctx.roundRect(10, 22, fillWidth, 22, 4); ctx.fill();
            }

            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(pct >= 0 ? pct : '?', 29, 34);

            return canvas.toDataURL('image/png');
        }

        connectBtn.addEventListener('click', async () => {
            console.log("按钮已点击，准备请求设备...");
            statusEl.textContent = "请求中...";
            statusEl.style.color = '#374151';
            
            if (!navigator.hid) {
                alert('当前环境不支持 WebHID');
                statusEl.textContent = '当前环境不支持 WebHID';
                return;
            }
            try {
                console.log("正在调用 navigator.hid.requestDevice...");
                // 【关键】改为空过滤器，让主进程去做筛选，避免底层过滤为空导致挂起
                const devices = await navigator.hid.requestDevice({ filters: [] });
                console.log("requestDevice 返回结果:", devices);
                
                if (devices.length === 0) {
                    statusEl.textContent = '未选择设备或已取消（请查看控制台日志）';
                    statusEl.style.color = '#dc2626';
                    return;
                }
                
                let connectedAny = false;
                for (const dev of devices) {
                    console.log(`尝试打开设备: ${dev.productName}, opened: ${dev.opened}`);
                    if (!dev.opened) {
                        await dev.open();
                    }
                    dev.addEventListener('inputreport', onInputReport);
                    connectedAny = true;
                }
                
                if (connectedAny) {
                    statusEl.textContent = `已连接：${devices[0].productName || 'Rapoo'}，请在托盘中查看电量。`;
                    statusEl.style.color = '#059669';
                    connectBtn.disabled = true;
                    window.electronAPI.updateBattery({ battery: -1, iconBase64: createIconBase64(-1) });
                }
            } catch (err) {
                console.error("连接过程发生错误:", err);
                statusEl.textContent = '连接失败：' + err.message;
                statusEl.style.color = '#dc2626';
            }
        });

        function onInputReport(event) {
            const { reportId, data } = event;
            const bytes = new Uint8Array(data.buffer);

            if (reportId === 0x07 && bytes.length > 7) {
                const pct = bytes[7];
                if (pct >= 0 && pct <= 100) {
                    console.log("获取到电量:", pct);
                    window.electronAPI.updateBattery({
                        battery: pct,
                        iconBase64: createIconBase64(pct)
                    });
                }
            }
        }

        window.onload = () => {
            window.electronAPI.updateBattery({ battery: -1, iconBase64: createIconBase64(-1) });
        };
    </script>
</body>
</html>
